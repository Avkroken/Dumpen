name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject incomplete remediation seeds
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '.github/codex-dispatch/issue-*.md' > /dev/null; then
            echo '::error::Incomplete remediation seed remains in the pull request.'
            find .github/codex-dispatch -maxdepth 1 -type f -name 'issue-*.md' -print
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
