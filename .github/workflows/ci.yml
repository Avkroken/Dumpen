name: Validate Worker and D1

on:
  # Merge-kön skickar merge_group.checks_requested. Utan den här
  # triggern svarar inget jobb och kön fastnar tills timeout.
  merge_group:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run regression tests
        run: bun run test

      - name: Validate D1 migrations from empty database
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .wrangler/state
          shopt -s nullglob
          migrations=(migrations/*.sql)
          if (( ${#migrations[@]} == 0 )); then
            echo "No D1 migrations found" >&2
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            echo "Applying ${migration}"
            bunx wrangler d1 execute klarsprak-db --local --file "${migration}"
          done

      - name: Validate Worker bundle and Wrangler config
        run: bunx wrangler deploy --dry-run --outdir .wrangler/dry-run
