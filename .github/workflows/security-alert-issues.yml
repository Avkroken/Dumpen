name: Skapa Issues för säkerhetsalerts

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  issues: write

concurrency:
  group: security-alert-issues
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skapa Issues för öppna security alerts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          api_list() {
            local endpoint="$1"
            local output="$2"
            local pages="${output}.pages"
            if gh api --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$endpoint" > "$pages" 2>/dev/null; then
              jq 'add // []' "$pages" > "$output"
            else
              printf '[]\n' > "$output"
            fi
          }

          api_list "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&per_page=100" /tmp/code-all.json
          jq '[.[] | select((.rule.security_severity_level // "") as $s | ["medium","high","critical"] | index($s))]' /tmp/code-all.json > /tmp/code.json

          api_list "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&severity=medium,high,critical&per_page=100" /tmp/dependabot-severity.json
          api_list "/repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&classification=malware&per_page=100" /tmp/dependabot-malware.json
          jq -s 'add | unique_by(.number)' /tmp/dependabot-severity.json /tmp/dependabot-malware.json > /tmp/dependabot.json

          gh issue list --state all --limit 1000 --json number,body > /tmp/issues.json
          exists() {
            jq -e --arg marker "$1" '.[] | select((.body // "") | contains($marker))' /tmp/issues.json >/dev/null
          }

          while IFS= read -r alert; do
            number="$(jq -r '.number' <<<"$alert")"
            marker="<!-- security-alert:code-scanning:${number} -->"
            exists "$marker" && continue
            severity="$(jq -r '.rule.security_severity_level | ascii_upcase' <<<"$alert")"
            rule="$(jq -r '.rule.name // .rule.id // "Code scanning alert"' <<<"$alert")"
            url="$(jq -r '.html_url' <<<"$alert")"
            body="$(printf '%s\nAutomatiskt skapat från ett öppet GitHub Code Scanning-alert med severity Medium eller högre.\n\n- **Severity:** %s\n- **Rule:** %s\n- **Alert:** %s\n' "$marker" "$severity" "$rule" "$url")"
            gh issue create --title "[Security][Code scanning][${severity}] ${rule}" --body "$body" >/dev/null
          done < <(jq -c '.[]' /tmp/code.json)

          while IFS= read -r alert; do
            number="$(jq -r '.number' <<<"$alert")"
            marker="<!-- security-alert:dependabot:${number} -->"
            exists "$marker" && continue
            if jq -e --argjson n "$number" '.[] | select(.number == $n)' /tmp/dependabot-malware.json >/dev/null; then
              severity="MALWARE"
              kind="malware"
            else
              severity="$(jq -r '(.security_advisory.severity // .security_vulnerability.severity // "unknown") | ascii_upcase' <<<"$alert")"
              kind="vulnerability"
            fi
            package="$(jq -r '.dependency.package.name // "unknown package"' <<<"$alert")"
            summary="$(jq -r '.security_advisory.summary // "Malicious dependency detected"' <<<"$alert")"
            url="$(jq -r '.html_url' <<<"$alert")"
            body="$(printf '%s\nAutomatiskt skapat från ett öppet GitHub Dependabot-%s-alert. Vanliga vulnerability-alerts kräver severity Medium eller högre; malware-alerts inkluderas alltid.\n\n- **Severity/class:** %s\n- **Package:** %s\n- **Summary:** %s\n- **Alert:** %s\n' "$marker" "$kind" "$severity" "$package" "$summary" "$url")"
            gh issue create --title "[Security][Dependabot][${severity}] ${package}: ${summary}" --body "$body" >/dev/null
          done < <(jq -c '.[]' /tmp/dependabot.json)
