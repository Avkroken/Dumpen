name: Deploy Cloudflare Worker & domain check

# Auto-deploy till Cloudflare Workers vid push till main.
# Migrationer appliceras före Worker-deploy så ny kod aldrig går live mot ett äldre schema.
#
# Secrets (Repo → Settings → Environments → produktion):
#   KLARSPRAK — Cloudflare API-token. Kräver Workers Scripts:Edit och D1:Edit.
#     Har INTE zonbehörighet (Zone → Workers Routes → Edit), därför ligger
#     custom-domain-routen fortfarande utanför wrangler.jsonc.
#
# Variables (Repo → Settings → Variables → Actions):
#   CLOUDFLARE_ACCOUNT_ID — kontots ID.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment: produktion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install
        run: bun install

      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply klarsprak-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.KLARSPRAK }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.KLARSPRAK }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # Wrangler-deploy bevisar att Workern finns, inte att domänen fortfarande
      # är kopplad. Kontrollen accepterar 403 eftersom Cloudflares botskydd kan
      # blockera GitHub-runnern; DNS, HTTPS-respons och frånvaro av 5xx är det
      # som verifieras här.
      - name: Kontrollera att domänen lever
        run: |
          set -uo pipefail
          host="klarsprak.denied.se"

          if ! getent hosts "$host" > /dev/null; then
            echo "::error::$host har ingen DNS-post — custom domain-kopplingen är borta, sajten är oåtkomlig"
            exit 1
          fi
          echo "DNS: $(getent hosts "$host" | head -1)"

          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$host/" || echo 000)
            case "$code" in
              000) echo "försök $attempt: ingen HTTPS-respons alls" ;;
              5*) echo "försök $attempt: edgen svarade $code" ;;
              *) echo "$host svarade $code — edgen lever (försök $attempt)"; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::$host har DNS men ingen fungerande edge efter fem försök"
          exit 1
